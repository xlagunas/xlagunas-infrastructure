name: Deploy infra (Caddy)

# La infra NO genera imatge (Caddy ve prefabricat). Aquest workflow només
# envia la config al VPS i fa "docker compose up -d" + reload de Caddy.

on:
  push:
    branches: [main]

concurrency:
  group: deploy-infra
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Copia els fitxers de config al VPS (mantenint reverse-proxy/)
      - name: Copy infra files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml,reverse-proxy/Caddyfile"
          target: /opt/xlagunas-infra

      # 2. Arrenca/actualitza Caddy i recarrega la config en calent
      - name: Up & reload
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/xlagunas-infra
            docker compose pull
            docker compose up -d
            # reload en calent: aplica canvis del Caddyfile sense recrear el
            # contenidor (up -d sol no els agafa perquè el fitxer va muntat)
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile || true
