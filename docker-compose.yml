services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificats Let's Encrypt (NO esborrar)
      - caddy_config:/config
    networks:
      - web

volumes:
  caddy_data:
  caddy_config:

# Aquesta xarxa la CREA aquest compose. Les apps la referencien com a
# "external: true" al seu propi compose. Per això l'infra ha d'arrencar PRIMER.
networks:
  web:
    name: web
